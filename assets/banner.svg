<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 48px;
      font-weight: 800;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
    }
    /* Dynamic background animations */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-light {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.08); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .rotating-gear {
      transform-origin: 1050px 150px;
      animation: spin-slow 25s linear infinite;
    }
    .pulsing-orb {
      transform-origin: 150px 150px;
      animation: pulse-light 6s ease-in-out infinite;
    }
    .flowing-arc {
      stroke-dasharray: 20 10;
      animation: dash-flow 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Background Geometric/Dynamic Accents (Kept in background) -->
  <circle class="pulsing-orb" cx="150" cy="150" r="120" fill="url(#glow-grad)" />
  <circle class="pulsing-orb" cx="1050" cy="150" r="140" fill="url(#glow-grad)" style="animation-delay: -3s;" />

  <!-- Decorative Rotating Clock/Gear Outline in Right Background -->
  <g class="rotating-gear" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.25">
    <circle cx="1050" cy="150" r="90" stroke-dasharray="6 6" />
    <circle cx="1050" cy="150" r="60" />
    <line x1="1050" y1="50" x2="1050" y2="250" />
    <line x1="950" y1="150" x2="1150" y2="150" />
    <line x1="979" y1="79" x2="1121" y2="221" />
    <line x1="979" y1="221" x2="1121" y2="79" />
  </g>

  <!-- Abstract Dynamic Flow Line (Background) -->
  <path class="flowing-arc" d="M -50,220 Q 300,280 600,180 T 1250,80" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" />

  <!-- Foreground Content Block -->
  <g transform="translate(80, 85)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="30" y="21" class="tag">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title" filter="url(#glow)">Awesome Time Management</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Top SaaS &amp; Open-Source Tools for Time Tracking, Pomodoro &amp; Productivity Analytics ⏳</text>
  </g>
</svg>
